<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express + Socket.IO</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        #input {
            width: 80%;
            padding: 10px;
        }
        #sendBtn {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Socket.IO with Express</h1>
    <div id="messages">Hello, welcome to the chat!</div>
    <div>
        <input type="text" id="input" placeholder="введите сообщение">
        <button id="sendBtn">Отправить</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
         const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        socket.on('chatMessage', (msg, senderId) => {
          const myId = socket.id;
            const label = senderId === myId ? 'Я' : senderId ? `Пользователь ${senderId}` : 'Неизвестный пользователь';
            messagesDiv.innerHTML += `<p><strong>${label}:</strong> ${msg}</p>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        sendBtn.addEventListener('click', () => {
            const message = msgInput.value.trim();

             if (!message) return;

            socket.emit('chatMessage', message);
            msgInput.value = '';
        });
        // Отправка по Enter
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });
        
    </script>   
</body>
    
</html>
